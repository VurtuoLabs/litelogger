<template>
    <div class={containerClass} role="status">
        <span class={iconWrapClass}>
            <lightning-icon icon-name={iconName} size="small" alternative-text=""></lightning-icon>
        </span>
        <p class="ll-empty__heading">{heading}</p>
        <template lwc:if={message}>
            <p class="ll-empty__message">{message}</p>
        </template>
        <template lwc:if={hint}>
            <p class="ll-empty__hint">
                <code class="ll-empty__code">{hint}</code>
            </p>
        </template>
        <template lwc:if={hasActions}>
            <div class="ll-empty__actions">
                <template lwc:if={actionLabel}>
                    <lightning-button
                        variant="brand"
                        label={actionLabel}
                        icon-name={actionIcon}
                        onclick={handleAction}
                    ></lightning-button>
                </template>
                <template lwc:if={secondaryActionLabel}>
                    <lightning-button
                        variant="neutral"
                        label={secondaryActionLabel}
                        onclick={handleSecondaryAction}
                    ></lightning-button>
                </template>
            </div>
        </template>
    </div>
</template>
